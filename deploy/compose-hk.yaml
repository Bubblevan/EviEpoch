services:
  migrate:
    image: eviepoch-ecs-eviepoch:da9837e
    volumes:
      - /opt/eviepoch-ecs/releases/2bf80f51fb3e/eviepoch:/srv/eviepoch:ro

  eviepoch:
    image: eviepoch-ecs-eviepoch:da9837e
    environment:
      EPOCH_ALLOW_SQLITE: "0"
      EPOCH_PROFILE: full
      EPOCH_MODEL_POLICY: research
      EPOCH_LLM_MODEL: deepseek-flash
      EPOCH_EMBED_MODEL: text-embedding-v4
      EPOCH_EMBED_DIMENSIONS: "1024"
      EPOCH_SELECTOR: beam
      EPOCH_CANDIDATE_LIMIT: "120"
      EPOCH_GRAPH_DEPTH: "3"
      EPOCH_GRAPH_BUDGET: "512"
      EPOCH_GRAPH_RETRIEVAL_ENABLED: "1"
      EPOCH_BEAM_WIDTH: "12"
      EPOCH_GAP_ITERATIONS: "1"
      EPOCH_RELATIONS: "1"
      EPOCH_CONSOLIDATION: "1"
      EPOCH_REFLECTION: "1"
      EPOCH_PROOF_BINDING: "1"
      EPOCH_TEMPORAL_ANCHORS: "1"
      EPOCH_STRUCTURED_INGEST: "1"
      EPOCH_STATE_PROJECTION: "1"
      EPOCH_COVERAGE: "1"
      EPOCH_EPISODE_NAVIGATION: "1"
      EPOCH_DISCLOSURE: "1"
      EPOCH_SUPPORT_AUDIT: "1"
      EPOCH_CONTEXT_EXPANSION: "1"
      EPOCH_EXTRACT_FACTS: "1"
      EPOCH_RECALL_QUERY: "1"
      EPOCH_RERANK_ENABLED: "1"
      EPOCH_RERANK_URL: http://host.docker.internal:18014/rerank
      EPOCH_ADD_CONCURRENCY: "16"
      EPOCH_SEARCH_CONCURRENCY: "16"
      EPOCH_WORKBENCH: "0"
    volumes:
      - /opt/eviepoch-ecs/releases/2bf80f51fb3e/eviepoch:/srv/eviepoch:ro
    networks:
      - default
      - cache

  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --dir
      - /tmp
      - --maxmemory
      - 24mb
      - --maxmemory-policy
      - allkeys-lru
    cpus: "0.10"
    mem_limit: 48m
    mem_reservation: 16m
    pids_limit: 32
    read_only: true
    tmpfs:
      - /tmp
      - /data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - cache

networks:
  default:
    external: true
    name: eviepoch-ecs_default
  cache:
    internal: true
