services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: eviepoch
      POSTGRES_USER: eviepoch_admin
      POSTGRES_PASSWORD: ${EPOCH_POSTGRES_PASSWORD:-local-admin-development-only}
    ports:
      - "127.0.0.1:${EPOCH_POSTGRES_PORT:-54329}:5432"
    volumes:
      - eviepoch-postgres:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U eviepoch_admin -d eviepoch"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    env_file:
      - path: ${EPOCH_ENV_FILE:-.env}
        required: false
    environment:
      EPOCH_ADMIN_DATABASE_URL: postgresql://eviepoch_admin:${EPOCH_POSTGRES_PASSWORD:-local-admin-development-only}@postgres:5432/eviepoch
    command: [python, -m, eviepoch.migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  eviepoch:
    build: .
    env_file:
      - path: ${EPOCH_ENV_FILE:-.env}
        required: false
    environment:
      EPOCH_PROFILE: full
      EPOCH_DATABASE_URL: postgresql://eviepoch_app:local-development-only@postgres:5432/eviepoch
      EPOCH_WORKBENCH: "0"
    ports:
      - "${EPOCH_BIND:-127.0.0.1}:${EPOCH_PORT:-8012}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  eviepoch-postgres:
